name: Worker deployen

# Nur manuell und bei Aenderungen am Worker - ein Deploy pro Frontend-Commit
# waere Verschwendung.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Die Testsuite braucht einen laufenden Worker. Faellt sie durch, wird
      # nicht deployt.
      - name: Tests gegen einen lokalen Worker
        run: |
          npx wrangler d1 execute songou --config wrangler.toml --local --file migrations/0001_init.sql
          npx wrangler d1 execute songou --config wrangler.toml --local --file test/seed.sql
          npx wrangler dev --config wrangler.toml --local --port 8787 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          npm test

      # Solange Token oder echte database_id fehlen, wird der Deploy sauber
      # uebersprungen statt fehlzuschlagen. Die Tests oben laufen trotzdem -
      # sie brauchen weder Secret noch echte IDs.
      - name: Sind die Deploy-Zugangsdaten vollstaendig?
        id: bereit
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN fehlt - Deploy uebersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q HIER_DATABASE_ID_EINTRAGEN wrangler.toml wrangler.auth.toml; then
            echo "::notice::database_id ist noch ein Platzhalter - Deploy uebersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Der API-Token ist das EINZIGE echte Geheimnis im ganzen Projekt.
      # Er authentifiziert wrangler gegenueber Cloudflare und landet niemals
      # in einem Artefakt - weder im Worker-Code noch in der Desktop-Binary.
      - name: songou-api deployen
        if: steps.bereit.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: songou-auth deployen
        if: steps.bereit.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.auth.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
