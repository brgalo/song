<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Band Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/main.js"></script>
    <style>
      :root {
        --green: #4ade80;
        --green-dark: #16a34a;
        --green-dim: #4ade8044;
        --bg: #141414;
        --bg2: #1e1e1e;
        --bg3: #252525;
        --bg4: #2e2e2e;
        --border: #333;
        --text: #f0f0f0;
        --text-dim: #888;
        --text-dimmer: #555;
        --red: #f87171;
        --yellow: #fbbf24;
        --sidebar-w: 16px;
        --sidebar-open: 280px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* ───── SIDEBAR ───── */
      #sidebar {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: var(--sidebar-w);
        background: var(--bg2);
        border-right: 2px solid var(--green);
        transition: width 0.28s cubic-bezier(.4,0,.2,1);
        overflow-x: hidden;
        white-space: nowrap;
        z-index: 100;
      }
      #sidebar:hover { width: var(--sidebar-open); }

      #sidebar-content {
        opacity: 0;
        transition: opacity 0.18s;
        padding: 20px 20px 20px 22px;
        min-width: var(--sidebar-open);
      }
      #sidebar:hover #sidebar-content { opacity: 1; }

      #sidebar-content h2 {
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 14px;
      }

      .song-folder {
        margin-bottom: 4px;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 500;
        padding: 7px 10px;
        border-radius: 6px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 7px;
        transition: background 0.15s, color 0.15s;
      }
      .song-folder:hover, .song-folder.open { background: var(--bg3); color: var(--text); }
      .folder-icon { font-size: 0.9em; }

      .song-versions { margin-left: 18px; display: none; }
      .version-item {
        padding: 5px 8px;
        font-size: 0.82rem;
        color: var(--text-dimmer);
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        gap: 6px;
        align-items: center;
        transition: color 0.15s, background 0.15s;
      }
      .version-item:hover { color: var(--green); background: var(--bg3); }
      .version-item.active-track { color: var(--green); font-weight: 600; }
      .track-icon { font-size: 0.85em; }

      /* ───── MAIN ───── */
      #main-content {
        flex: 1;
        padding: 20px 24px 20px 38px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        gap: 0;
      }

      .band-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 4px;
        flex-wrap: wrap;
      }
      .band-title {
        font-family: 'Space Mono', monospace;
        font-size: 1rem;
        font-weight: 700;
        color: var(--green);
        letter-spacing: 0.05em;
      }
      .user-select-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .user-prefix {
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .user-select {
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        background: var(--bg3);
        color: var(--green);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s;
      }
      .user-select:hover, .user-select:focus { border-color: var(--green); }
      .user-select option { background: var(--bg2); color: var(--text); }

      #current-song-title {
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }

      /* ───── WAVEFORM ───── */
      #waveform {
        background: var(--bg3);
        border-radius: 8px;
        padding: 8px 0;
        cursor: crosshair;
        border: 1px solid var(--border);
        margin-bottom: 10px;
        position: relative;
        transition: opacity 0.2s;
      }
      #waveform.loading {
        opacity: 0.4;
        cursor: wait;
        pointer-events: none;
      }
      #waveform.loading::after {
        content: '⏳ Lade Audio…';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        color: var(--green);
        letter-spacing: 0.1em;
        pointer-events: none;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .loading-pulse { animation: pulse 1.4s ease-in-out infinite; }

      /* ───── TRANSPORT BAR ───── */
      #transport {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        padding: 8px 12px;
        background: var(--bg2);
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .transport-btn {
        padding: 6px 16px;
        cursor: pointer;
        background: var(--green);
        border: none;
        color: #000;
        font-weight: 700;
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        border-radius: 4px;
        letter-spacing: 0.05em;
        transition: opacity 0.15s, transform 0.1s;
      }
      .transport-btn:hover { opacity: 0.85; }
      .transport-btn:active { transform: scale(0.96); }
      .transport-btn.loop-active {
        background: var(--yellow);
        box-shadow: 0 0 8px var(--yellow);
      }

      /* Volume */
      .volume-control {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      .volume-control label {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        color: var(--text-dim);
      }
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        width: 80px;
        height: 4px;
        background: var(--bg4);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
        border: none;
        box-shadow: none;
        padding: 0;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px; height: 12px;
        border-radius: 50%;
        background: var(--green);
        cursor: pointer;
      }
      #volume-label {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: var(--text-dim);
        min-width: 32px;
      }

      /* Loop indicator */
      #loop-indicator {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: var(--yellow);
        display: none;
        align-items: center;
        gap: 6px;
      }
      #loop-stop-btn {
        background: none;
        border: 1px solid var(--yellow);
        color: var(--yellow);
        font-size: 0.65rem;
        padding: 2px 7px;
        border-radius: 3px;
        cursor: pointer;
        font-family: 'Space Mono', monospace;
      }
      #loop-stop-btn:hover { background: var(--yellow); color: #000; }

      /* ───── COMMENT UI ───── */
      #comment-ui { margin-top: 0; display: none; flex-direction: column; gap: 14px; }

      .comment-input-wrap {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        position: relative;
      }
      .comment-input-wrap h4 {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        color: var(--green);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #comment-input {
        width: 100%;
        padding: 9px 12px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }
      #comment-input:focus { border-color: var(--green); }
      #comment-hint {
        font-size: 0.75rem;
        color: var(--red);
        margin-top: 5px;
        opacity: 0;
        transition: opacity 0.3s;
        font-family: 'Space Mono', monospace;
      }

      /* ───── SORT & SEARCH BAR ───── */
      #comment-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sort-btn {
        font-family: 'Space Mono', monospace;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg3);
        color: var(--text-dim);
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
      }
      .sort-btn:hover { border-color: var(--green); color: var(--text); }
      .sort-btn.active { border-color: var(--green); color: var(--green); background: var(--green-dim); }

      #search-input {
        flex: 1;
        min-width: 140px;
        max-width: 280px;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        outline: none;
        transition: border-color 0.2s;
      }
      #search-input:focus { border-color: var(--green); }
      #search-input::placeholder { color: var(--text-dimmer); }

      /* ───── COMMENTS LIST ───── */
      #comments-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px; }

      .comment-box {
        background: var(--bg2);
        padding: 12px 14px 10px;
        border-radius: 7px;
        transition: background 0.2s, filter 0.2s;
        border: 1px solid var(--border);
      }
      .reply-box {
        background: var(--bg3);
        margin-top: 8px;
        padding: 9px 12px 8px;
        border-radius: 5px;
        transition: background 0.2s, filter 0.2s;
      }
      .comment-highlight {
        filter: brightness(1.25);
        background: var(--bg3) !important;
      }

      .comment-actions {
        position: absolute;
        right: 0; top: 0;
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.8rem;
        opacity: 0.5;
        padding: 2px 4px;
        border-radius: 3px;
        transition: opacity 0.15s, background 0.15s;
      }
      .icon-btn:hover { opacity: 1; background: var(--bg4); }

      .time-badge {
        display: inline-block;
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: var(--text-dimmer);
        background: var(--bg4);
        border-radius: 3px;
        padding: 1px 6px;
        margin-left: 6px;
      }
      .timestamp-label {
        font-size: 0.75rem;
        color: var(--text-dimmer);
        margin-left: 8px;
      }
      .comment-text {
        margin-top: 6px;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: #ddd;
        line-height: 1.5;
      }

      /* ───── REACTIONS ───── */
      .reactions-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 8px;
      }
      .reaction-btn {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 9px;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: border-color 0.15s, background 0.15s, transform 0.1s;
        color: var(--text);
        font-family: inherit;
      }
      .reaction-btn:hover { border-color: var(--green); background: var(--bg4); transform: scale(1.05); }
      .reaction-btn.reacted { border-color: var(--green); background: var(--green-dim); }
      .reaction-count {
        font-size: 0.75rem;
        font-family: 'Space Mono', monospace;
        color: var(--text-dim);
      }

      /* ───── REPLY INPUT ───── */
      .reply-row { margin-top: 6px; }
      .reply-input {
        width: 100%;
        max-width: 420px;
        padding: 6px 10px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.82rem;
        outline: none;
        transition: border-color 0.18s;
      }
      .reply-input:focus { border-color: var(--green); }
      .reply-input::placeholder { color: var(--text-dimmer); }

      .no-comments {
        color: var(--text-dimmer);
        font-style: italic;
        font-size: 0.85rem;
        padding: 10px 0;
        font-family: 'Space Mono', monospace;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-content">
        <h2>Songs</h2>
        <div id="folder-list">Lade Ordner…</div>
      </div>
    </div>

    <!-- Main -->
    <div id="main-content">
      <div id="app"></div>
      <h3 id="current-song-title">Kein Song ausgewählt</h3>

      <div id="waveform"></div>

      <!-- Transport -->
      <div id="transport">
        <button class="transport-btn" id="play-btn">▶ / ⏸</button>
        <button class="transport-btn" id="loop-btn" title="Loop für aktiven Bereich an/aus">🔁</button>

        <!-- Volume -->
        <div class="volume-control">
          <label>VOL</label>
          <input type="range" id="volume-slider" min="0" max="1" step="0.02" value="1">
          <span id="volume-label">100%</span>
        </div>

        <!-- Loop indicator + stop -->
        <span id="loop-indicator" style="display:none;">
          <button id="loop-stop-btn">✕ Loop</button>
        </span>
      </div>

      <!-- Comment UI -->
      <div id="comment-ui">
        <!-- New comment input -->
        <div class="comment-input-wrap">
          <h4>Neuer Kommentar</h4>
          <input type="text" id="comment-input" placeholder="Bereich markieren, dann hier tippen + Enter…">
          <div id="comment-hint">⚠ Bitte zuerst einen Bereich in der Wellenform markieren!</div>
        </div>

        <!-- Sort + Search -->
        <div id="comment-controls">
          <button class="sort-btn active" data-sort="time">⏱ Song-Zeit<span class="sort-arrow"> ↑</span></button>
          <button class="sort-btn" data-sort="date">📅 Datum<span class="sort-arrow"></span></button>
          <button class="sort-btn" data-sort="replies">💬 Antworten<span class="sort-arrow"></span></button>
          <input type="text" id="search-input" placeholder="🔍 Suche…">
        </div>

        <!-- Comments -->
        <div id="comments-list"></div>
      </div>
    </div>
  </body>
</html>
