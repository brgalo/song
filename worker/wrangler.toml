# songou-api — die eigentliche API.
# WICHTIG: Auf diesem Worker darf KEIN Cloudflare Access liegen. Er prüft selbst
# (Access-JWT ODER Device-Token) und muss Bearer-Requests der Desktop-App
# durchlassen, statt sie in einen Login-Redirect zu schicken.
name = "songou-api"
main = "src/api.js"
compatibility_date = "2026-08-01"
account_id = "7555eb74d6f1b1518dc5b4e7c15c4503"

[[d1_databases]]
binding = "DB"
database_name = "songou"
database_id = "69f9807b-6066-46dd-b162-7ae23671229a"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "songou-audio"

[vars]
# Aus dem Zero-Trust-Dashboard: Settings → Custom Pages → Team domain
ACCESS_TEAM_DOMAIN = "blue-frog-d37c.cloudflareaccess.com"
# Application Audience (AUD) Tag der Access-Anwendung vor songou-auth
ACCESS_AUD = "99f92be9fffbcfeaef8eccbbdbd132244c2cdd8ba6206a31715476aae22b494d"
